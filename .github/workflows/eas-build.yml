name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Build profile'
        required: true
        default: 'production-aab'
        type: choice
        options:
          - production-aab
          - production
          - preview
          - development

jobs:
  build:
    name: EAS Local Build
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Java (Required for Android local builds) ──────────────────
      - name: Setup Java (JDK 17)
        if: inputs.platform == 'android' || inputs.platform == 'all'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Node.js ──────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install JS dependencies ────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Setup Expo / EAS CLI ───────────────────────────────────────────
      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 6. Build App (Local) ──────────────────────────────────────────────
      #      Runs build locally on the GitHub Actions runner.
      #      Downloads keystores/credentials from Expo servers using EXPO_TOKEN.
      - name: Build App (Local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          
          # Run local build
          eas build \
            --local \
            --platform "${{ inputs.platform }}" \
            --profile "${{ inputs.profile }}" \
            --non-interactive
            
          # Move local build outputs (*.apk, *.aab, *.ipa) to the artifacts folder
          find . -maxdepth 1 -name "*.apk" -o -name "*.aab" -o -name "*.ipa" | while read -r file; do
            echo "Found local build artifact: $file"
            mv "$file" artifacts/
          done
          
          ls -lh artifacts/

      # ── 7. Upload to GitHub Actions artifacts ────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifio-${{ inputs.profile }}-${{ inputs.platform }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
